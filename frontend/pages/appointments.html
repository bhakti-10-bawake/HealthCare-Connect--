<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Appointments | Healthcare Connect</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >

    <link rel="stylesheet" href="../css/reset.css">
    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/utilities.css">
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

<div class="app">

    <main class="page">

        <header class="page-header">

            <div class="page-header-content">
                <p>Your healthcare visits</p>
                <h1>Appointments</h1>
            </div>

            <a
                href="book-appointment.html"
                class="btn btn-primary"
            >
                <i class="bi bi-plus-lg"></i>
                <span>Book</span>
            </a>

        </header>


        <!-- Appointment Filters -->

        <section class="section">

            <div
                id="appointmentFilters"
                class="d-flex gap-2 flex-wrap"
            >

                <button
                    class="btn btn-secondary btn-sm active"
                    data-filter="upcoming"
                >
                    Upcoming
                </button>

                <button
                    class="btn btn-outline btn-sm"
                    data-filter="completed"
                >
                    Completed
                </button>

                <button
                    class="btn btn-outline btn-sm"
                    data-filter="cancelled"
                >
                    Cancelled
                </button>

                <button
                    class="btn btn-outline btn-sm"
                    data-filter="all"
                >
                    All
                </button>

            </div>

        </section>


        <!-- Appointment List -->

        <section class="section">

            <div class="section-header">

                <h2 class="section-title">
                    Your appointments
                </h2>

                <span
                    id="appointmentCount"
                    class="text-muted"
                >
                    —
                </span>

            </div>


            <div
                id="appointmentList"
                class="d-flex flex-column gap-4"
            >

                <!-- API data will be rendered here -->

                <div class="card empty-state">

                    <div class="icon-box icon-box-lg">
                        <i class="bi bi-calendar2-check"></i>
                    </div>

                    <h3>No appointments yet</h3>

                    <p>
                        Book an appointment with a healthcare professional
                        to see it here.
                    </p>

                    <a
                        href="book-appointment.html"
                        class="btn btn-primary mt-4"
                    >
                        Find a doctor
                    </a>

                </div>

            </div>

        </section>

    </main>


    <!-- Bottom Navigation -->

    <nav class="bottom-nav">

        <a href="dashboard.html" class="bottom-nav-item">
            <i class="bi bi-house"></i>
            <span>Home</span>
        </a>

        <a href="doctors.html" class="bottom-nav-item">
            <i class="bi bi-person-badge"></i>
            <span>Doctors</span>
        </a>

        <a
            href="appointments.html"
            class="bottom-nav-item active"
        >
            <i class="bi bi-calendar2"></i>
            <span>Appointments</span>
        </a>

        <a href="medicines.html" class="bottom-nav-item">
            <i class="bi bi-capsule"></i>
            <span>Medicines</span>
        </a>

        <a href="profile.html" class="bottom-nav-item">
            <i class="bi bi-person"></i>
            <span>Profile</span>
        </a>

    </nav>

</div>

<script src="../js/app.js"></script>
<script src="../js/appointments.js"></script>

</body>
</html>
