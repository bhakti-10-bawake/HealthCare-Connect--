<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account | Healthcare Connect</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >

    <link rel="stylesheet" href="../css/reset.css">
    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/utilities.css">
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

<main class="auth-page">

    <div class="auth-container">

        <div class="auth-brand">
            <h1>Healthcare Connect</h1>

            <p>
                Your digital connection to better healthcare.
            </p>
        </div>


        <section class="auth-card">

            <h2>Create your account</h2>

            <p>
                Join Healthcare Connect and manage your healthcare in one place.
            </p>


            <form class="auth-form" id="registerForm">

                <!-- Full Name -->

                <div class="form-group">

                    <label
                        class="form-label"
                        for="fullName"
                    >
                        Full name
                    </label>

                    <input
                        class="form-input"
                        type="text"
                        id="fullName"
                        name="fullName"
                        placeholder="Enter your full name"
                        autocomplete="name"
                        required
                    >

                </div>


                <!-- Email -->

                <div class="form-group">

                    <label
                        class="form-label"
                        for="registerEmail"
                    >
                        Email address
                    </label>

                    <input
                        class="form-input"
                        type="email"
                        id="registerEmail"
                        name="email"
                        placeholder="Enter your email"
                        autocomplete="email"
                        required
                    >

                </div>


                <!-- Phone -->

                <div class="form-group">

                    <label
                        class="form-label"
                        for="phone"
                    >
                        Phone number
                    </label>

                    <input
                        class="form-input"
                        type="tel"
                        id="phone"
                        name="phone"
                        placeholder="Enter your phone number"
                        autocomplete="tel"
                        required
                    >

                </div>


                <!-- Role -->

                <div class="form-group">

                    <label
                        class="form-label"
                        for="role"
                    >
                        Account type
                    </label>

                    <select
                        class="form-select"
                        id="role"
                        name="role"
                        required
                    >

                        <option value="">
                            Select account type
                        </option>

                        <option value="PATIENT">
                            Patient
                        </option>

                        <option value="DOCTOR">
                            Doctor
                        </option>

                        <option value="PHARMACY">
                            Pharmacy
                        </option>

                    </select>

                </div>


                <!-- Password -->

                <div class="form-group">

                    <label
                        class="form-label"
                        for="registerPassword"
                    >
                        Password
                    </label>

                    <input
                        class="form-input"
                        type="password"
                        id="registerPassword"
                        name="password"
                        placeholder="Create a password"
                        autocomplete="new-password"
                        minlength="8"
                        required
                    >

                </div>


                <!-- Confirm Password -->

                <div class="form-group">

                    <label
                        class="form-label"
                        for="confirmPassword"
                    >
                        Confirm password
                    </label>

                    <input
                        class="form-input"
                        type="password"
                        id="confirmPassword"
                        name="confirmPassword"
                        placeholder="Confirm your password"
                        autocomplete="new-password"
                        minlength="8"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="btn btn-primary btn-lg w-100"
                >

                    <i class="bi bi-person-plus"></i>

                    Create account

                </button>

            </form>


            <div class="auth-footer">

                <span>Already have an account?</span>

                <a href="login.html">
                    Sign in
                </a>

            </div>

        </section>

    </div>

</main>


<script src="../js/app.js"></script>

<script>

document
    .getElementById("registerForm")
    .addEventListener("submit", function(event) {

        event.preventDefault();

        const password =
            document.getElementById("registerPassword").value;

        const confirmPassword =
            document.getElementById("confirmPassword").value;

        if (password !== confirmPassword) {

            showMessage(
                "Passwords do not match.",
                "danger"
            );

            return;
        }

        showMessage(
            "Registration form is ready for backend integration.",
            "info"
        );

    });

</script>

</body>
</html>
