<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Find Doctors | Healthcare Connect</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="stylesheet" href="../css/reset.css">
    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/utilities.css">
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

<div class="app">

    <main class="page">

        <header class="page-header">

            <div class="page-header-content">
                <p>Healthcare professionals</p>
                <h1>Find a doctor</h1>
            </div>

        </header>


        <!-- Search -->

        <section class="section">

            <div class="search-box">

                <i class="bi bi-search"></i>

                <input
                    type="search"
                    id="doctorSearch"
                    class="form-input"
                    placeholder="Search doctors or specializations..."
                >

            </div>

        </section>


        <!-- Categories -->

        <section class="section">

            <div class="section-header">
                <h2 class="section-title">Specializations</h2>
            </div>

            <div
                id="specializationFilters"
                class="d-flex gap-2 flex-wrap"
            >

                <button
                    class="btn btn-secondary btn-sm active"
                    data-specialization="all"
                >
                    All
                </button>

                <button
                    class="btn btn-outline btn-sm"
                    data-specialization="General Physician"
                >
                    General Physician
                </button>

                <button
                    class="btn btn-outline btn-sm"
                    data-specialization="Cardiologist"
                >
                    Cardiologist
                </button>

                <button
                    class="btn btn-outline btn-sm"
                    data-specialization="Pediatrician"
                >
                    Pediatrician
                </button>

                <button
                    class="btn btn-outline btn-sm"
                    data-specialization="Dermatologist"
                >
                    Dermatologist
                </button>

                <button
                    class="btn btn-outline btn-sm"
                    data-specialization="Gynecologist"
                >
                    Gynecologist
                </button>

            </div>

        </section>


        <!-- Doctors -->

        <section class="section">

            <div class="section-header">

                <h2 class="section-title">
                    Available professionals
                </h2>

                <span
                    id="doctorResultCount"
                    class="text-muted"
                >
                    —
                </span>

            </div>


            <div
                id="doctorList"
                class="grid grid-2"
            >

                <!-- Doctor cards will be populated by doctors.js -->

                <div class="card empty-state">

                    <div class="icon-box icon-box-lg">
                        <i class="bi bi-person-badge"></i>
                    </div>

                    <h3>Loading doctors</h3>

                    <p>
                        Healthcare professionals will appear here.
                    </p>

                </div>

            </div>

        </section>

    </main>


    <nav class="bottom-nav">

        <a href="dashboard.html" class="bottom-nav-item">
            <i class="bi bi-house"></i>
            <span>Home</span>
        </a>

        <a href="doctors.html" class="bottom-nav-item active">
            <i class="bi bi-person-badge"></i>
            <span>Doctors</span>
        </a>

        <a href="appointments.html" class="bottom-nav-item">
            <i class="bi bi-calendar2"></i>
            <span>Appointments</span>
        </a>

        <a href="medicines.html" class="bottom-nav-item">
            <i class="bi bi-capsule"></i>
            <span>Medicines</span>
        </a>

        <a href="profile.html" class="bottom-nav-item">
            <i class="bi bi-person"></i>
            <span>Profile</span>
        </a>

    </nav>

</div>

<script src="../js/app.js"></script>
<script src="../js/doctors.js"></script>

</body>
</html>
